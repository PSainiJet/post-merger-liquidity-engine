<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Liquidity forecasting ML use-case workflow</title>
  <desc id="desc">Workflow from manual treasury liquidity consolidation to automated data processing, machine learning forecasts, dashboard alerts, and proof-of-concept learning.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1400" height="820" fill="#f8fafc"/>
  <text x="700" y="54" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="30" font-weight="700" fill="#0f172a">48-Hour Liquidity Forecasting Workflow</text>
  <text x="700" y="88" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="17" fill="#475569">From manual treasury review to an ML-assisted proof of concept</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="55" y="145" width="260" height="190" rx="16" fill="#fff1f2" stroke="#fb7185" stroke-width="2" filter="url(#shadow)"/>
    <text x="185" y="184" text-anchor="middle" font-size="21" font-weight="700" fill="#9f1239">Before: Manual Process</text>
    <text x="185" y="222" text-anchor="middle" font-size="16" fill="#334155">Combine bank positions</text>
    <text x="185" y="248" text-anchor="middle" font-size="16" fill="#334155">Review withdrawals and rates</text>
    <text x="185" y="274" text-anchor="middle" font-size="16" fill="#334155">Estimate 48-hour needs</text>
    <text x="185" y="300" text-anchor="middle" font-size="16" fill="#334155">Run scenarios separately</text>

    <rect x="370" y="145" width="270" height="190" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="2" filter="url(#shadow)"/>
    <text x="505" y="184" text-anchor="middle" font-size="21" font-weight="700" fill="#1d4ed8">Automated Data Pipeline</text>
    <text x="505" y="222" text-anchor="middle" font-size="16" fill="#334155">15-minute aligned data</text>
    <text x="505" y="248" text-anchor="middle" font-size="16" fill="#334155">CS legacy + UBS positions</text>
    <text x="505" y="274" text-anchor="middle" font-size="16" fill="#334155">Rates, withdrawals, margins</text>
    <text x="505" y="300" text-anchor="middle" font-size="16" fill="#334155">Feature and target creation</text>

    <rect x="695" y="145" width="315" height="190" rx="16" fill="#f0fdf4" stroke="#4ade80" stroke-width="2" filter="url(#shadow)"/>
    <text x="852" y="184" text-anchor="middle" font-size="21" font-weight="700" fill="#166534">Forecasting Models</text>
    <text x="852" y="222" text-anchor="middle" font-size="16" fill="#334155">Random Forest regression</text>
    <text x="852" y="248" text-anchor="middle" font-size="16" fill="#334155">Currency-level SARIMAX</text>
    <text x="852" y="274" text-anchor="middle" font-size="16" fill="#334155">Weighted ensemble forecast</text>
    <text x="852" y="300" text-anchor="middle" font-size="16" fill="#334155">CHF / USD / EUR outputs</text>

    <rect x="1065" y="145" width="280" height="190" rx="16" fill="#faf5ff" stroke="#c084fc" stroke-width="2" filter="url(#shadow)"/>
    <text x="1205" y="184" text-anchor="middle" font-size="21" font-weight="700" fill="#7e22ce">Treasury Dashboard</text>
    <text x="1205" y="222" text-anchor="middle" font-size="16" fill="#334155">48-hour liquidity forecasts</text>
    <text x="1205" y="248" text-anchor="middle" font-size="16" fill="#334155">OK / WARNING / CRITICAL</text>
    <text x="1205" y="274" text-anchor="middle" font-size="16" fill="#334155">Shortfall recommendations</text>
    <text x="1205" y="300" text-anchor="middle" font-size="16" fill="#334155">Streamlit interface</text>

    <path d="M315 240 H360" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M640 240 H685" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M1010 240 H1055" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="270" y="470" width="860" height="220" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/>
    <text x="700" y="512" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">Proof-of-Concept Feedback Loop</text>

    <rect x="305" y="545" width="220" height="92" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
    <text x="415" y="579" text-anchor="middle" font-size="17" font-weight="700" fill="#9a3412">Stress Testing</text>
    <text x="415" y="605" text-anchor="middle" font-size="14" fill="#334155">withdrawals, margins, rates</text>

    <rect x="590" y="545" width="220" height="92" rx="12" fill="#f0fdfa" stroke="#2dd4bf" stroke-width="2"/>
    <text x="700" y="579" text-anchor="middle" font-size="17" font-weight="700" fill="#115e59">User Review</text>
    <text x="700" y="605" text-anchor="middle" font-size="14" fill="#334155">treasury/risk stakeholders</text>

    <rect x="875" y="545" width="220" height="92" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="985" y="579" text-anchor="middle" font-size="17" font-weight="700" fill="#334155">Learning</text>
    <text x="985" y="605" text-anchor="middle" font-size="14" fill="#334155">validate before production</text>

    <path d="M1205 345 V420 H415 V460" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M525 591 H580" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M810 591 H865" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M985 545 C985 430 700 420 700 345" stroke="#64748b" stroke-width="3" fill="none" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  </g>
</svg>
